# Nexternel stack — package version: see VERSION at repo root
services:
  postgres:
    image: postgres:16-alpine
    container_name: nexternel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7-alpine
    container_name: nexternel-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      TZ: ${TZ}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: nexternel-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"

  nodered:
    image: nodered/node-red:3.1
    container_name: nexternel-nodered
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - nodered_data:/data
    ports:
      - "1880:1880"
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy

  esphome:
    image: ghcr.io/esphome/esphome
    container_name: nexternel-esphome
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./esphome:/config
    environment:
      TZ: ${TZ}
      # Use ping instead of mDNS for online/offline (mDNS often fails in Docker)
      ESPHOME_DASHBOARD_USE_PING: "true"
    # Optional: plug ESP32 into the Ubuntu server USB and uncomment for direct flash:
    # privileged: true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  # --- Nexternel V3 (api + ui) — V2 Next.js `web` retired in Phase 10 ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexternel-api
    restart: unless-stopped
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      TZ: ${TZ}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX}
      INFLUXDB_URL: ${INFLUXDB_URL}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      SERVER_IP: ${SERVER_IP}
    volumes:
      - ./esphome:/esphome:ro
      # Host CPU thermal zones for System Information widget (read-only)
      - /sys/class/thermal:/sys/class/thermal:ro
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    container_name: nexternel-ui
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  influxdb_data:
  mosquitto_data:
  mosquitto_log:
  nodered_data:
