# Nexternel — Home Assistant Glow (ESP8266) — pulse LED energy meter
# OTA node name MUST stay home-assistant-glow (matches firmware on device).
# 1) Open this file on your laptop: DAMN HomE\esphome\glow-energy.yaml
# 2) Edit substitutions: Wi-Fi, MQTT (username+password must match ~/nexternel/.env)
# 3) Copy entire file → Nexternel ESPHome :6052 → glow-energy → Edit → paste → Save → Install OTA

substitutions:
  device_name: home-assistant-glow
  friendly_name: House
  project_version: "3.1.0-nexternel"
  device_description: "Measure your energy consumption with the pulse LED on your smart meter"
  pulse_pin: GPIO12
  status_led: GPIO5
  # imp/kWh rate on your meter label
  pulse_rate: "1000"
  mqtt_topic_prefix: nexternel/glow-energy
  # --- Wi-Fi + MQTT (must match ~/nexternel/.env: MQTT_USERNAME / MQTT_PASSWORD) ---
  wifi_ssid: "DAMN"
  wifi_password: "n3v3rm1nd"
  mqtt_broker: "192.168.3.101"
  mqtt_username: "damn_nexternel"
  mqtt_password: "n3v3rm1nd"
  # OTA password already on the Glow ESP8266 from first install (must match or wireless flash fails).
  # Your earlier HA YAML used: 6b9a43cf81410b56605c67e147b14923 — use that if you never changed it.
  ota_password: "6b9a43cf81410b56605c67e147b14923"

esphome:
  name: "${device_name}"
  friendly_name: Glow Energy
  comment: "${device_description}"
  project:
    name: "klaasnicolaas.home-assistant-glow"
    version: "${project_version}"

esp8266:
  board: nodemcuv2

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  ap:
    ssid: "${device_name}"

captive_portal:

logger:

api:

ota:
  - platform: esphome
    password: "${ota_password}"

safe_mode:

mqtt:
  broker: "${mqtt_broker}"
  port: 1883
  username: "${mqtt_username}"
  password: "${mqtt_password}"
  topic_prefix: ${mqtt_topic_prefix}
  discovery: false

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/London

output:
  - platform: gpio
    pin: GPIO2
    id: output_red
  - platform: gpio
    pin: GPIO4
    id: output_green

light:
  - platform: binary
    internal: true
    id: led_red
    name: Red
    output: output_red

status_led:
  pin:
    number: ${status_led}

button:
  - platform: restart
    name: "Restart - Glow"
  - platform: template
    name: "Reset - Total Energy"
    id: button_reset_total
    on_press:
      - pulse_meter.set_total_pulses:
          id: sensor_energy_pulse_meter
          value: 0

text_sensor:
  - platform: template
    name: "Glow - Installed version"
    id: glow_version
    icon: "mdi:label-outline"
    entity_category: diagnostic
    lambda: |-
      return {"${project_version}"};
    update_interval: 6h
  - platform: version
    hide_timestamp: true
    name: "${friendly_name} - ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} - IP Address"
      icon: mdi:wifi
    ssid:
      name: "${friendly_name} - Connected SSID"
      icon: mdi:wifi-strength-2

sensor:
  - platform: wifi_signal
    name: "${friendly_name} - WiFi Signal"
    update_interval: 120s

  - platform: pulse_meter
    name: "${friendly_name} - Power Consumption"
    id: sensor_energy_pulse_meter
    unit_of_measurement: "W"
    state_class: measurement
    device_class: power
    icon: mdi:flash-outline
    accuracy_decimals: 0
    pin: ${pulse_pin}
    on_value:
      then:
        - light.turn_on:
            id: led_red
        - delay: 0.5s
        - light.turn_off:
            id: led_red
    filters:
      - lambda: return x * ((60.0 / ${pulse_rate}) * 1000.0);
    total:
      name: "${friendly_name} - Total Energy"
      id: sensor_total_energy
      unit_of_measurement: "kWh"
      icon: mdi:circle-slice-3
      state_class: total_increasing
      device_class: energy
      accuracy_decimals: 3
      filters:
        - lambda: return x * (1.0 / ${pulse_rate});

  - platform: total_daily_energy
    name: "${friendly_name} - Daily Energy"
    id: sensor_total_daily_energy
    power_id: sensor_energy_pulse_meter
    unit_of_measurement: "kWh"
    icon: mdi:circle-slice-3
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
