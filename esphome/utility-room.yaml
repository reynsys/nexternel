# Nexternel — Utility Room ESP32 (DHT temperature + humidity)
# OTA node name MUST stay utility-room (matches firmware on device).
# 1) Edit substitutions below (MQTT must match ~/nexternel/.env)
# 2) Upload to ~/nexternel/esphome/ → docker compose restart esphome
# 3) ESPHome :6052 → utility-room → Install → Wirelessly (OTA)
# 4) Admin → Devices → import from YAML → Sync capabilities

substitutions:
  device_name: utility-room
  friendly_name: Utility Room
  mqtt_topic_prefix: nexternel/utility-room
  wifi_ssid: "DAMN"
  wifi_password: "n3v3rm1nd"
  mqtt_broker: "192.168.3.101"
  mqtt_username: "damn_nexternel"
  mqtt_password: "n3v3rm1nd"
  # From your Home Assistant YAML — required for OTA from existing firmware
  ota_password: "9cc516b429dd03312ab192704be2595d"
  ap_ssid: "Utility-Room Fallback Hotspot"
  ap_password: "isTi3adXYOPY"

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome
    password: "${ota_password}"

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  ap:
    ssid: "${ap_ssid}"
    password: "${ap_password}"

captive_portal:

mqtt:
  broker: "${mqtt_broker}"
  port: 1883
  username: "${mqtt_username}"
  password: "${mqtt_password}"
  topic_prefix: ${mqtt_topic_prefix}
  discovery: false

sensor:
  - platform: dht
    pin: GPIO2
    temperature:
      name: "Utility Room Temperature"
      id: utility_room_temperature
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: "Utility Room Humidity"
      id: utility_room_humidity
      unit_of_measurement: "%"
      accuracy_decimals: 0
    update_interval: 60s
