# Nexternel — Kids Room ESP32 (DHT temperature + humidity)
# OTA node name MUST stay kids-room (matches firmware on device).
# 1) Edit substitutions below (MQTT must match ~/nexternel/.env)
# 2) ESPHome :6052 → kids-room → Install → Wirelessly (OTA)
# 3) Admin → Devices → import/sync from YAML → Sync capabilities

substitutions:
  device_name: kids-room
  friendly_name: Kids Room
  mqtt_topic_prefix: nexternel/kids-room
  wifi_ssid: "DAMN"
  wifi_password: "n3v3rm1nd"
  mqtt_broker: "192.168.3.101"
  mqtt_username: "damn_nexternel"
  mqtt_password: "n3v3rm1nd"
  # From your Home Assistant YAML — required for OTA from existing firmware
  ota_password: "1b81aabb9a9be4cdd693f7241ce9b5b4"
  ap_ssid: "Kids Room Fallback Hotspot"
  ap_password: "xdTLYHO7mqWR"

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome
    password: "${ota_password}"

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  ap:
    ssid: "${ap_ssid}"
    password: "${ap_password}"

captive_portal:

mqtt:
  broker: "${mqtt_broker}"
  port: 1883
  username: "${mqtt_username}"
  password: "${mqtt_password}"
  topic_prefix: ${mqtt_topic_prefix}
  discovery: false

sensor:
  - platform: dht
    pin: GPIO2
    temperature:
      name: "Kids Room Temperature"
      id: kids_room_temperature
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: "Kids Room Humidity"
      id: kids_room_humidity
      unit_of_measurement: "%"
      accuracy_decimals: 0
    update_interval: 60s
